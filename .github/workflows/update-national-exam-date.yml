name: Update national exam date

on:
  schedule:
    - cron: '20 0 1-15 9 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read official schedule
        run: node scripts/update-national-exam-date.mjs
      - name: Commit schedule when changed
        run: |
          git add app/national-exam-date.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update national exam date"
          git push
